server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（与 deploy/Caddyfile 的 header 块互为镜像，改动必须同步）。
    # 必须 always：不加时只作用于 2xx/3xx，deny 的 403 与代理错误页会漏。
    # 注意 nginx 继承规则：server 级 add_header 只被「没有自己的 add_header」的
    # location 继承——今后任何 location 一旦新增 add_header，必须把这四条复写进去。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Agent 内部面（/api/agent/**、/mcp）不在前端调用清单里，也接受调用方自备 user_id，
    # 绝不该从边缘可达：只允许直连内网端口 + X-Agent-Token（R1-8）。
    location /api/agent/ {
        deny all;
        return 403;
    }

    location /mcp {
        deny all;
        return 403;
    }

    location /api/ {
        # 后端统一到 FastAPI（M7-b）：业务端点 + agent 面同一个服务。
        # SSE 不需要在这里关缓冲：Python 侧的事件响应自带 `X-Accel-Buffering: no`。
        proxy_pass http://agent-python:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 必须**替换**而不是追加（$proxy_add_x_forwarded_for 会把客户端自带的
        # X-Forwarded-For 留在链首，那一段永远是可伪造的）。后端 app.common.client_ip
        # 按可信网段从右往左取跳，配的网段要与 docker-compose 里的 TRUSTED_PROXIES 一致。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }

    # 分享卡外壳（P1-5，与 deploy/Caddyfile 同源、改动必须同步）：/s/{token} 由后端
    # 注入 og meta 后整页返回。XFF 同样必须替换——外壳端点按 IP 分钟窗限速。
    location /s/ {
        proxy_pass http://agent-python:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # 带构建 hash 的静态产物（P1-4，与 deploy/Caddyfile 同源、改动必须同步）：文件名
    # 即内容指纹，immutable 一年；本 location 有自己的 add_header，server 级四条安全
    # 头不再被继承（见上方继承规则注记），必须复写。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA 外壳与其余路径：可变 HTML 一律 no-cache。同理复写四条安全头。
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
