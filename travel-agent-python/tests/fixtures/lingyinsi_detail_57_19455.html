      <h2>景区公告：灵隐寺免费开放及预约须知</h2>
      <p class="meta">发布时间：2025-11-20　来源：灵隐寺管理处</p>
      <div class="content">
        <p>
          根据上级部门关于景区惠民开放的统一部署，自 2025 年 12 月 1 日起，
          灵隐寺免票开放，不再收取门票。飞来峰景区门票另行按规定执行。
        </p>
        <p>
          为保障游览安全与秩序，寺院实行实名预约分时游览。请游客提前通过
          官方预约渠道填写本人身份信息，按预约时段入园，预约成功后凭有效证件
          核验进入。
        </p>
        <p>开放时间以当日公告为准，遇重大法务活动将临时调整并另行通告。</p>
      </div>
      <p class="footer-note">本页面为灵隐寺官方网站发布的权威信息。</p>
