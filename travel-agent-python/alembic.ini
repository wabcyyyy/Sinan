[alembic]
# Migration runner that wraps the existing Flyway SQL (PLAN v3.0 section 1.4).
# Keep this file ASCII-only: configparser reads it with the OS locale encoding,
# and Chinese comments break `alembic` on Windows/GBK (verified failure).
script_location = app/db/migrations
prepend_sys_path = .
# Alembic 1.13+ asks for an explicit separator; without it prepend_sys_path falls back
# to legacy splitting on spaces/commas/colons and warns.
path_separator = os
version_path_separator = os
# URL is resolved by env.py from app.common.config.settings (.env / environment).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
